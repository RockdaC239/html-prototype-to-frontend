<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">HTML 原型转前端页面</title>
  <desc id="desc">从 HTML、CSS、JavaScript 原型迁移到 React、Vue 等框架，再通过 ego-browser 在真实宿主检查页面。</desc>
  <rect width="1200" height="360" rx="24" fill="#0B1524"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="60" y="74" fill="#74D9D0" font-size="19" font-weight="700" letter-spacing="2">CODEX SKILL / SOURCE TO SCREEN</text>
    <text x="60" y="156" fill="#F5F8FB" font-size="60" font-weight="700">HTML 原型转前端</text>
    <text x="62" y="213" fill="#B9C9D9" font-size="27">保留源码里的结构、样式与交互</text>
    <text x="62" y="254" fill="#B9C9D9" font-size="27">在真实应用中校验迁移结果</text>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <path d="M650 92 H1140 M650 181 H1140 M650 270 H1140" stroke="#294055" stroke-width="2"/>
    <text x="654" y="78" fill="#74D9D0" font-size="20" font-weight="700">01</text>
    <text x="702" y="78" fill="#F5F8FB" font-size="25" font-weight="600">原型源码</text>
    <text x="704" y="122" fill="#B9C9D9" font-size="19">HTML · CSS · JavaScript</text>

    <text x="654" y="167" fill="#74D9D0" font-size="20" font-weight="700">02</text>
    <text x="702" y="167" fill="#F5F8FB" font-size="25" font-weight="600">框架组件</text>
    <text x="704" y="211" fill="#B9C9D9" font-size="19">React · Vue · 现有体系</text>

    <text x="654" y="256" fill="#74D9D0" font-size="20" font-weight="700">03</text>
    <text x="702" y="256" fill="#F5F8FB" font-size="25" font-weight="600">真实宿主验证</text>
    <text x="704" y="300" fill="#B9C9D9" font-size="19">ego-browser · 尺寸 · 状态</text>
  </g>

  <path d="M58 310 H1140" stroke="#294055" stroke-width="2"/>
  <text x="60" y="337" fill="#86A0B4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">SOURCE → COMPONENT → PARITY</text>
</svg>
